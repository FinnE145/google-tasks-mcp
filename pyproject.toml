[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "tasks-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
